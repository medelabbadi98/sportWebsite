<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gallery - Click Fit</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="home.html">Click Fit</a>
            <a class="nav-link text-white" href="home.html">Home</a>
        </div>
    </nav>

    <main class="container my-5">
        <h2 class="text-center mb-4">Uploaded Images</h2>
        <div id="gallery" class="row"></div>
    </main>

    <footer class="bg-dark text-white py-4 text-center">
        <p>&copy; Click Fit. All rights reserved.</p>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
       $(document).ready(function () {
    $.get('/images', function (images) {
        images.forEach(image => {
            $('#gallery').append(`
                <div class="col-md-4 mb-3">
                    <div class="card">
                        <img src="${image}" class="card-img-top" alt="Uploaded Image">
                    </div>
                </div>
            `);
        });
    });
});

    </script>
</body>
</html>
